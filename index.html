const COLORS={g:'#3b82f6',y:'#f97316',c:'#a855f7',r:'#22c55e'};
const MEDIA=['g','y','c','r'];
const LABELS={g:'Google',y:'Yahoo',c:'Criteo',r:'RTB House'};
const DASHES={g:[],y:[5,3],c:[2,2],r:[8,4]};

let metric='cost', fyFilter='all', grain='monthly', chart;

// 週次データ生成（月次を週数で按分）
function genWeekly(src) {
  const rows = [];
  src.forEach(d => {
    const weeks = Math.round(d.days / 7);
    for(let w=1; w<=weeks; w++) {
      const label = d.m + `-W${w}`;
      const row = {m: label, fy: d.fy};
      MEDIA.forEach(med => {
        const s = d[med];
        if(!s || s.cost==null) { row[med]={cost:null,imp:null,click:null,ctr:s?s.ctr:null,cpc:s?s.cpc:null,cv:null,cpa:s?s.cpa:null}; return; }
        row[med] = {
          cost: Math.round(s.cost/weeks),
          imp: Math.round(s.imp/weeks),
          click: Math.round(s.click/weeks),
          ctr: s.ctr,
          cpc: s.cpc,
          cv: Math.round(s.cv/weeks),
          cpa: s.cpa
        };
      });
      rows.push(row);
    }
  });
  return rows;
}

// 日次データ生成（月次を日数で按分）
function genDaily(src) {
  const rows = [];
  src.forEach(d => {
    const days = d.days;
    for(let day=1; day<=days; day++) {
      const label = d.m + `-D${String(day).padStart(2,'0')}`;
      const row = {m: label, fy: d.fy};
      MEDIA.forEach(med => {
        const s = d[med];
        if(!s || s.cost==null) { row[med]={cost:null,imp:null,click:null,ctr:s?s.ctr:null,cpc:s?s.cpc:null,cv:null,cpa:s?s.cpa:null}; return; }
        row[med] = {
          cost: Math.round(s.cost/days),
          imp: Math.round(s.imp/days),
          click: Math.round(s.click/days),
          ctr: s.ctr,
          cpc: s.cpc,
          cv: +(s.cv/days).toFixed(1),
          cpa: s.cpa
        };
      });
      rows.push(row);
    }
  });
  return rows;
}

function getSource() {
  if(grain === 'daily') {
    let src = DAILY;
    if(fyFilter !== 'all') {
      const fyRanges = {
        'FY2023':['2022-11-01','2023-10-31'],
        'FY2024':['2023-11-01','2024-10-31'],
        'FY2025':['2024-11-01','2025-10-31'],
        'FY2026':['2025-11-01','2026-10-31'],
      };
      const [s,e] = fyRanges[fyFilter] || ['',''];
      src = src.filter(d => d.d >= s && d.d <= e);
    }
    return src.map(d => ({m: d.d, fy:'', g: d.g, y: d.y, c: d.c, r: d.r}));
  }
  if(grain === 'weekly') {
    let src = WEEKLY;
    if(fyFilter !== 'all') {
      const fyRanges = {
        'FY2023':['2022-W44','2023-W43'],
        'FY2024':['2023-W44','2024-W43'],
        'FY2025':['2024-W44','2025-W43'],
        'FY2026':['2025-W44','2026-W43'],
      };
      const [s,e] = fyRanges[fyFilter] || ['',''];
      src = src.filter(d => d.w >= s && d.w <= e);
    }
    return src.map(d => ({m: d.w, fy:'', g: d.g, y: d.y, c: d.c, r: d.r}));
  }
  let src = MONTHLY;
  if(fyFilter !== 'all') src = src.filter(d => d.fy === fyFilter);
  return src;
}

function formatLabel(m, g) {
  if(g === 'daily') {
    // m = '2026-01-02'
    const p = m.split('-');
    return `${p[1]}/${p[2]}`;
  }
  if(g === 'weekly') {
    // m = '2026-W03'
    return m.replace('-W','年W');
  }
  const parts = m.split('-');
  return `'${parts[0]}/${parts[1]}月`;
}

function formatY(v, m) {
  if(v==null) return '';
  if(m==='cost') return '¥'+Math.round(v/10000)+'万';
  if(m==='imp') return Math.round(v/10000)+'万';
  if(m==='click') return grain==='monthly' ? Math.round(v/1000)+'K' : Math.round(v).toLocaleString();
  if(m==='ctr') return (+v).toFixed(1)+'%';
  if(m==='cpc'||m==='cpa') return '¥'+Math.round(v).toLocaleString();
  return (+v).toFixed(grain==='monthly'?0:1);
}

function render() {
  const data = getSource();
  // 日次は多すぎるので間引き
  let displayData = data;
  const maxPoints = 120;
  if(data.length > maxPoints) {
    const step = Math.ceil(data.length / maxPoints);
    displayData = data.filter((_, i) => i % step === 0);
  }

  const labels = displayData.map(d => formatLabel(d.m, grain));
  const datasets = MEDIA.map(med => ({
    label: LABELS[med],
    data: displayData.map(d => d[med][metric]),
    borderColor: COLORS[med],
    backgroundColor: COLORS[med]+'15',
    borderWidth: 2,
    borderDash: DASHES[med],
    pointRadius: grain==='daily' ? 1 : grain==='weekly' ? 2 : 3,
    pointHoverRadius: 5,
    tension: 0.3,
    spanGaps: false
  }));

  const isDark = matchMedia('(prefers-color-scheme:dark)').matches;
  const gridC = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  const tickC = isDark ? '#9ca3af' : '#888';

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById('mainChart'), {
    type: 'line',
    data: {labels, datasets},
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {mode:'index', intersect:false},
      plugins: {
        legend: {display: false},
        tooltip: {
          backgroundColor: 'rgba(255,255,255,0.96)',
          titleColor: '#333',
          bodyColor: '#555',
          borderColor: '#ddd',
          borderWidth: 1,
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              if(v==null) return null;
              return ` ${ctx.dataset.label}: ${formatY(v, metric)}`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: {color:tickC, font:{size:10}, maxRotation:45, autoSkip:true, maxTicksLimit: grain==='daily'?20:grain==='weekly'?24:18},
          grid: {color: gridC}
        },
        y: {
          ticks: {color:tickC, font:{size:10}, callback: v => formatY(v, metric)},
          grid: {color: gridC}
        }
      }
    }
  });
}

// イベント
document.querySelectorAll('.gtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.gtab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    grain = btn.dataset.g;
    render();
  });
});
document.querySelectorAll('.mtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mtab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    metric = btn.dataset.m;
    render();
  });
});
document.getElementById('selFY').addEventListener('change', e => {
  fyFilter = e.target.value;
  render();
});

render();
</script>

  if(sessionStorage.getItem(KEY) === "1") return;

  overlay.style.cssText = "position:fixed;inset:0;background:#f5f6f8;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;";
  overlay.innerHTML = '<div style="background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:40px 48px;text-align:center;min-width:300px"><p style="font-size:15px;font-weight:600;color:#111;margin-bottom:6px">オミカレ 媒体別ダッシュボード</p><p style="font-size:12px;color:#999;margin-bottom:24px">パスワードを入力してください</p><input id="pwInput" type="password" placeholder="パスワード" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;margin-bottom:12px"><p id="pwErr" style="font-size:12px;color:#e24b4a;margin-bottom:12px;display:none">パスワードが違います</p><button id="pwBtn" style="width:100%;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">ログイン</button></div>';
  document.body.appendChild(overlay);
  document.body.style.overflow = "hidden";
  function tryLogin(){
    var val = document.getElementById("pwInput").value;
    if(val === PASS){
      sessionStorage.setItem(KEY, "1");
      overlay.remove();
      document.body.style.overflow = "";
    } else {
      document.getElementById("pwErr").style.display = "block";
      document.getElementById("pwInput").value = "";
    }
  }
  document.getElementById("pwBtn").addEventListener("click", tryLogin);
  document.getElementById("pwInput").addEventListener("keydown", function(e){ if(e.key==="Enter") tryLogin(); });
  setTimeout(function(){ document.getElementById("pwInput").focus(); }, 100);
})();
</script>
</body>
</html>
